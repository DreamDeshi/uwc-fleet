name: CI

# This repo deploys on push to main (Railway auto-migrates on preDeploy), so CI is
# the last safety net before prod. Three jobs:
#
#   checks       Fast, self-contained (no database): both typechecks + both unit
#                suites, including the money-path incentive/dispatch conformance
#                tests. This is the gate that must always be green.
#   integration  DB-backed: spins up a throwaway Postgres, applies the committed
#                migrations, checks for migration/checksum drift, seeds, and runs
#                the in-process (supertest) integration tier. Isolated in its own
#                job so a DB hiccup never masks the fast checks.
#   migrations   Refuses destructive SQL that carries no written reason. The
#                integration job CANNOT catch this: it runs against a FRESH
#                database, where a DELETE simply matches zero rows. Only this
#                job reads the statements as text and asks whether the data loss
#                was intended. It also prints every added migration's SQL into
#                the run summary, because merging one applies it to production
#                immediately.
on:
  push:
    branches: [main]
  # Deliberately NOT scoped to `branches: [main]`. A stacked pull request — one
  # whose base is another feature branch — got no CI at all under that filter,
  # and stayed uncovered until its parent merged and it retargeted. Branch
  # protection still blocked the eventual merge, so nothing unchecked could
  # reach main, but "the gate will catch it later" is not the same as knowing
  # now: the whole point of CI on a PR is feedback while the work is open.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + unit tests (API + mobile)
    runs-on: ubuntu-latest
    env:
      # prisma generate needs the datasource env to resolve; it does NOT connect,
      # and the unit tests never query, so a placeholder URL is enough.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace api

      - name: API typecheck
        run: npm run typecheck --workspace api

      - name: API unit suite (incl. money-path conformance)
        run: npm test --workspace api

      - name: Mobile typecheck
        run: npm run typecheck --workspace mobile

      # The e2e workspace was never typechecked anywhere, so a type error could
      # sit on main indefinitely — one did: reset.ts read `consignee.area` (the
      # customs-document rule needs it) against a type that did not declare it.
      # It ran fine, because the API really does return the field, and nothing
      # ever compiled the file. Cheap to check, and it is real source.
      - name: E2E typecheck
        run: npx tsc --noEmit
        working-directory: e2e

      - name: Mobile unit suite
        run: npm test --workspace mobile

  migrations:
    name: Migration safety (destructive SQL guard)
    runs-on: ubuntu-latest
    steps:
      # Full history: the scan diffs against the base branch to work out which
      # migrations this pull request ADDS, so their SQL can be shown in full.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No `prisma generate` and no database: the scanner reads migration.sql as
      # text. Keeping it independent means it still reports when Postgres or the
      # Prisma engine download is having a bad day.
      - name: Scan migrations for unjustified destructive SQL
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            npm run check:migrations --workspace api -- --base "origin/$BASE_REF"
          else
            npm run check:migrations --workspace api
          fi

  selectors:
    name: E2E selector drift (specs vs live UI copy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install, no browsers, no database: the guard reads the spec files and
      # mobile/src as text. It exists because the driver suite sat red for a week
      # after a redesign renamed every label it clicked, and a renamed label is
      # indistinguishable from a broken feature — both are "element not found".
      # Running it without the Playwright stack means it still reports on the days
      # the browser download or the test database is having a bad time.
      - name: Check e2e selectors against renderable copy
        run: node e2e/scripts/check-selectors.mjs

  e2e:
    name: E2E (Playwright, real browser — FEATURE FLAGS ON)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uwc
          POSTGRES_PASSWORD: uwc
          POSTGRES_DB: uwc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uwc -d uwc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://uwc:uwc@localhost:5432/uwc_test?schema=public

      # ⚠ THIS JOB RUNS WITH THE FEATURE FLAGS ON. GREEN HERE IS NOT "WHAT PROD
      # DOES". Production has FEATURE_EXCEPTIONS and FEATURE_CHANGE_REQUESTS
      # UNSET, so those surfaces are dark for real users today.
      #
      # Flags-on is the deliberate choice because the flags-off behaviour is
      # already covered where it belongs — the API's own gating tests assert the
      # routes 404 while a flag is off — whereas the exception workflow's driver
      # sheet, admin lane and requestor banner have NO other cover at all, and
      # they are the next thing due to be switched on. Running them dark would
      # mean shipping a flag-on with five specs that have never executed.
      #
      # If you are reading a green tick here to decide whether production is
      # safe: it tells you the flag-on world works. It tells you nothing about
      # what a requestor sees today.
      FEATURE_EXCEPTIONS: "true"
      FEATURE_CHANGE_REQUESTS: "true"
      EXPO_PUBLIC_FEATURE_EXCEPTIONS: "true"
      EXPO_PUBLIC_FEATURE_CHANGE_REQUESTS: "true"

      # The suite drives hundreds of requests in a few minutes; the production
      # limiter would 429 the run. Both limiters off, per the documented switch.
      RATE_LIMIT_MAX: "0"
      SENSITIVE_RATE_LIMIT_MAX: "0"
      CORS_ORIGIN: http://localhost:8081

      # The web build reads this at EXPORT time (see mobile/src/services/api.ts).
      # It exists so CI never has to edit the committed app.json, whose value is
      # the production URL.
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace api

      - name: Apply migrations + seed
        run: |
          npm run migrate:deploy --workspace api
          npm run seed --workspace api
          npm run seed:test --workspace api

      - name: Start the API
        run: |
          npx tsx api/src/index.ts > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/health || { echo "API did not start:"; cat api.log; exit 1; }
        env:
          PORT: "3000"
          NODE_ENV: development

      # A STATIC EXPORT, not `expo start --web`. The dev server rebuilds lazily,
      # which on a cold runner means the first navigation can outlive the test
      # timeout, and it has burned captures before by serving a stale bundle.
      # An export is built once, deterministically, and cannot go stale mid-run.
      - name: Build the web app
        run: npx expo export --platform web --output-dir dist
        working-directory: mobile

      - name: Serve the web app
        run: |
          npx --yes serve -s mobile/dist -l 8081 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081 >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8081 >/dev/null || { echo "web app did not serve:"; cat serve.log; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Playwright suite
        run: npx playwright test --reporter=line
        working-directory: e2e

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            e2e/test-results/**
            api.log
            serve.log
          retention-days: 7

  integration:
    name: Integration tier (Postgres) + migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uwc
          POSTGRES_PASSWORD: uwc
          POSTGRES_DB: uwc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uwc -d uwc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The integration harness (tests-integration/setup.ts) reads TEST_DATABASE_URL
      # and HARD-REFUSES any non-localhost host — the service is on localhost, so it
      # passes that safety gate. migrate deploy / seed / migrate status use
      # DATABASE_URL. No Cloudinary secrets are needed: the suite mocks uploadBuffer
      # (see exceptionWorkflow.test.ts) and runs with CLOUDINARY_* unset by design.
      DATABASE_URL: postgresql://uwc:uwc@localhost:5432/uwc_test?schema=public
      TEST_DATABASE_URL: postgresql://uwc:uwc@localhost:5432/uwc_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace api

      - name: Apply migrations (deploy — committed migrations only)
        run: npm run migrate:deploy --workspace api

      - name: Verify no migration / checksum drift
        run: npx prisma migrate status --schema api/prisma/schema.prisma

      - name: Seed master data + test fixtures
        run: |
          npm run seed --workspace api
          npm run seed:test --workspace api

      - name: Integration suite (supertest, in-process)
        run: npm run test:integration --workspace api
